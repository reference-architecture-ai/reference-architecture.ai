<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" role="img" aria-labelledby="adlc-title adlc-desc" style="background:#1a1b26">
<title id="adlc-title">The ADLC orbit</title>
<desc id="adlc-desc">Seven lifecycle phases orbit the agent: Frame, Specify, Build, Evaluate, Deploy, Operate, and Orchestrate then retire. A build loop returns work from Evaluate to Build until the release bar is met; a production loop turns live failures into new evaluation cases. A governance ring of identity, least privilege, registry and audit trail wraps every phase.</desc>
<rect width="900" height="900" fill="#1a1b26"/>
<style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}</style>
<defs>
<marker id="ah-main" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#565f89"/></marker>
<marker id="ah-build" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#7aa2f7"/></marker>
<marker id="ah-prod" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#9ece6a"/></marker>
<path id="ring-text" d="M 65 455 A 385 385 0 0 0 835 455" fill="none"/>
</defs>
<circle cx="450" cy="455" r="385" fill="none" stroke="#f7768e" stroke-opacity="0.16" stroke-width="34"/>
<text font-size="12" letter-spacing="3" font-weight="600" fill="#f7768e" fill-opacity="0.85"><textPath href="#ring-text" startOffset="50%" text-anchor="middle" dy="4">GOVERNANCE RING</textPath></text>
<rect x="142.0" y="169.8" width="71.6" height="26" rx="13" fill="#1a1b26" stroke="#f7768e" stroke-width="1.4"/>
<text x="177.8" y="187.3" font-size="13" text-anchor="middle" fill="#a9b1d6">Identity</text>
<rect x="661.2" y="169.8" width="122.0" height="26" rx="13" fill="#1a1b26" stroke="#f7768e" stroke-width="1.4"/>
<text x="722.2" y="187.3" font-size="13" text-anchor="middle" fill="#a9b1d6">Least privilege</text>
<rect x="763.1" y="604.7" width="71.6" height="26" rx="13" fill="#1a1b26" stroke="#f7768e" stroke-width="1.4"/>
<text x="798.9" y="622.2" font-size="13" text-anchor="middle" fill="#a9b1d6">Registry</text>
<rect x="54.5" y="604.7" width="93.2" height="26" rx="13" fill="#1a1b26" stroke="#f7768e" stroke-width="1.4"/>
<text x="101.1" y="622.2" font-size="13" text-anchor="middle" fill="#a9b1d6">Audit trail</text>
<path d="M 512.0 192.2 A 270 270 0 0 1 616.8 242.7" fill="none" stroke="#565f89" stroke-width="2" marker-end="url(#ah-main)"/>
<path d="M 694.1 339.6 A 270 270 0 0 1 720.0 453.0" fill="none" stroke="#565f89" stroke-width="2" marker-end="url(#ah-main)"/>
<path d="M 692.4 573.9 A 270 270 0 0 1 619.9 664.9" fill="none" stroke="#565f89" stroke-width="2" marker-end="url(#ah-main)"/>
<path d="M 508.2 718.7 A 270 270 0 0 1 391.8 718.7" fill="none" stroke="#565f89" stroke-width="2" marker-end="url(#ah-main)"/>
<path d="M 280.1 664.9 A 270 270 0 0 1 207.6 573.9" fill="none" stroke="#565f89" stroke-width="2" marker-end="url(#ah-main)"/>
<path d="M 180.0 453.0 A 270 270 0 0 1 205.9 339.6" fill="none" stroke="#565f89" stroke-width="2" marker-end="url(#ah-main)"/>
<path d="M 548.5 643.3 Q 497.5 492.9 649.6 508.5" fill="none" stroke="#7aa2f7" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah-build)"/>
<text x="592" y="468" font-size="13" text-anchor="middle" fill="#7aa2f7">rebuild until</text>
<text x="592" y="484" font-size="13" text-anchor="middle" fill="#7aa2f7">the bar is met</text>
<path d="M 244.7 517.1 Q 417.1 523.3 525.5 649.7" fill="none" stroke="#9ece6a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah-prod)"/>
<text x="330" y="577" font-size="13" text-anchor="middle" fill="#9ece6a">live failures become</text>
<text x="330" y="593" font-size="13" text-anchor="middle" fill="#9ece6a">new eval cases</text>
<circle cx="450" cy="455" r="78" fill="#292e42" stroke="#e0af68" stroke-width="2"/>
<text x="450" y="451" font-size="22" font-weight="700" text-anchor="middle" fill="#a9b1d6">Agent</text>
<text x="450" y="473" font-size="12" text-anchor="middle" fill="#565f89">behaviour is the product</text>
<circle cx="450.0" cy="185.0" r="54" fill="#292e42" stroke="#3d59a1" stroke-width="1.6"/>
<circle cx="450.0" cy="155.0" r="10" fill="#3d59a1"/>
<text x="450.0" y="159.0" font-size="11" font-weight="700" text-anchor="middle" fill="#a9b1d6">1</text>
<text x="450.0" y="189.0" font-size="16" font-weight="600" text-anchor="middle" fill="#a9b1d6">Frame</text>
<text x="450.0" y="206.0" font-size="10.5" text-anchor="middle" fill="#565f89">jobs to be done</text>
<circle cx="661.1" cy="286.7" r="54" fill="#292e42" stroke="#3d59a1" stroke-width="1.6"/>
<circle cx="661.1" cy="256.7" r="10" fill="#3d59a1"/>
<text x="661.1" y="260.7" font-size="11" font-weight="700" text-anchor="middle" fill="#a9b1d6">2</text>
<text x="661.1" y="290.7" font-size="16" font-weight="600" text-anchor="middle" fill="#a9b1d6">Specify</text>
<text x="661.1" y="307.7" font-size="10.5" text-anchor="middle" fill="#565f89">metrics, intake</text>
<circle cx="713.2" cy="515.1" r="54" fill="#292e42" stroke="#3d59a1" stroke-width="1.6"/>
<circle cx="713.2" cy="485.1" r="10" fill="#3d59a1"/>
<text x="713.2" y="489.1" font-size="11" font-weight="700" text-anchor="middle" fill="#a9b1d6">3</text>
<text x="713.2" y="519.1" font-size="16" font-weight="600" text-anchor="middle" fill="#a9b1d6">Build</text>
<text x="713.2" y="536.1" font-size="10.5" text-anchor="middle" fill="#565f89">instructions, tools</text>
<circle cx="567.1" cy="698.3" r="54" fill="#292e42" stroke="#7aa2f7" stroke-width="2.5"/>
<circle cx="567.1" cy="668.3" r="10" fill="#7aa2f7"/>
<text x="567.1" y="672.3" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1b26">4</text>
<text x="567.1" y="702.3" font-size="16" font-weight="600" text-anchor="middle" fill="#a9b1d6">Evaluate</text>
<text x="567.1" y="719.3" font-size="10.5" text-anchor="middle" fill="#565f89">eval gate</text>
<circle cx="332.9" cy="698.3" r="54" fill="#292e42" stroke="#3d59a1" stroke-width="1.6"/>
<circle cx="332.9" cy="668.3" r="10" fill="#3d59a1"/>
<text x="332.9" y="672.3" font-size="11" font-weight="700" text-anchor="middle" fill="#a9b1d6">5</text>
<text x="332.9" y="702.3" font-size="16" font-weight="600" text-anchor="middle" fill="#a9b1d6">Deploy</text>
<text x="332.9" y="719.3" font-size="10.5" text-anchor="middle" fill="#565f89">progressive</text>
<circle cx="186.8" cy="515.1" r="54" fill="#292e42" stroke="#3d59a1" stroke-width="1.6"/>
<circle cx="186.8" cy="485.1" r="10" fill="#3d59a1"/>
<text x="186.8" y="489.1" font-size="11" font-weight="700" text-anchor="middle" fill="#a9b1d6">6</text>
<text x="186.8" y="519.1" font-size="16" font-weight="600" text-anchor="middle" fill="#a9b1d6">Operate</text>
<text x="186.8" y="536.1" font-size="10.5" text-anchor="middle" fill="#565f89">observe, drift</text>
<circle cx="238.9" cy="286.7" r="54" fill="#292e42" stroke="#3d59a1" stroke-width="1.6"/>
<circle cx="238.9" cy="256.7" r="10" fill="#3d59a1"/>
<text x="238.9" y="260.7" font-size="11" font-weight="700" text-anchor="middle" fill="#a9b1d6">7</text>
<text x="238.9" y="290.7" font-size="14" font-weight="600" text-anchor="middle" fill="#a9b1d6">Orchestrate</text>
<text x="238.9" y="307.7" font-size="10.5" text-anchor="middle" fill="#565f89">then retire</text>
<text x="450.0" y="886" font-size="11" text-anchor="middle" fill="#565f89">Synthesis of the Salesforce, IBM, Glean, Microsoft and LangChain ADLC frameworks, October 2026</text>
</svg>
