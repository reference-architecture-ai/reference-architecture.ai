<title id="traditional-vs-mcp-title">Traditional Agent Compared With MCP-Native Agent</title>
<desc id="traditional-vs-mcp-desc">Comparison diagram showing a traditional agent without an execution boundary and an MCP-native agent with validation, authorization, and invocation stages.</desc>
